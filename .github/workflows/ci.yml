name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod verify
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod verify
      # Unit tests only — no hardware/DB integration tests in CI (v1).
      - run: go test -race -shuffle=on -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...

  security:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Severity: medium+ (block HIGH and MEDIUM). Confidence: high+ (block HIGH and MEDIUM).
          # Zero high-severity findings required; medium findings are flagged but not blocking.
          # Exclude test files (G404: math/rand in benchmarks, G104: unchecked errors in tests).
          args: >
            -severity=medium
            -confidence=medium
            -exclude-dir=benchmark
            -exclude-dir=integration
            -exclude=G404,G104
            ./...

  proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
