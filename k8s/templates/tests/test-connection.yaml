apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "y-ai-pond.fullname" . }}-test-connection"
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.9.1
      command:
        - curl
        - "-f"
        - "http://{{ include "y-ai-pond.componentName" (list . "server") }}:{{ .Values.server.service.port }}/health"
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
