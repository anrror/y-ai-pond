apiVersion: v1
kind: Service
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "postgresql") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "y-ai-pond.componentLabels" (list . "postgresql") | nindent 4 }}
