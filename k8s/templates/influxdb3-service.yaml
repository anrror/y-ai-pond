apiVersion: v1
kind: Service
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "influxdb3") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: influxdb3
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.influxdb3.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "y-ai-pond.componentLabels" (list . "influxdb3") | nindent 4 }}
