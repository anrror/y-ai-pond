apiVersion: v1
kind: Service
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "server") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "y-ai-pond.componentLabels" (list . "server") | nindent 4 }}
