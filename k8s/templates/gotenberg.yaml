{{- if .Values.gotenberg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "gotenberg") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  replicas: {{ .Values.gotenberg.replicas }}
  selector:
    matchLabels:
      {{- include "y-ai-pond.componentLabels" (list . "gotenberg") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "y-ai-pond.componentLabels" (list . "gotenberg") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gotenberg
          image: "{{ .Values.gotenberg.image.repository }}:{{ .Values.gotenberg.image.tag }}"
          imagePullPolicy: {{ .Values.gotenberg.image.pullPolicy }}
          command:
            {{- toYaml .Values.gotenberg.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gotenberg.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "gotenberg") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: gotenberg
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.gotenberg.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "y-ai-pond.componentLabels" (list . "gotenberg") | nindent 4 }}
{{- end }}
