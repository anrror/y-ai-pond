apiVersion: v1
kind: Secret
metadata:
  name: {{ include "y-ai-pond.componentName" (list . "secret") }}
  labels:
    {{- include "y-ai-pond.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
data:
  JWT_SECRET: {{ required "secrets.jwtSecret 必须设置（生产环境请通过 --set 或外部 Secret 注入）" .Values.secrets.jwtSecret | b64enc | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword 必须设置" .Values.secrets.postgresPassword | b64enc | quote }}
  INFLUXDB_TOKEN: {{ required "secrets.influxdbToken 必须设置" .Values.secrets.influxdbToken | b64enc | quote }}
  INFLUXDB_ADMIN_PASSWORD: {{ required "secrets.influxdbAdminPassword 必须设置" .Values.secrets.influxdbAdminPassword | b64enc | quote }}
