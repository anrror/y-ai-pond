version: "3"

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test:
    desc: Run all unit tests with race detector
    cmds:
      - go test -race -shuffle=on -count=1 ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  proto:
    desc: Generate Protobuf code
    cmds:
      - buf generate

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t y-ai-pond:latest .

  docker-up:
    desc: Start services with Docker Compose
    cmds:
      - docker compose up --build -d

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ dist/ coverage.out
